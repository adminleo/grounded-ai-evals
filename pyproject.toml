[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "grounded-ai-evals"
version = "0.1.0"
description = "A four-layer method for evaluating AI systems that answer with evidence"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Leonardo Bornhäusser" }]
keywords = ["evaluation", "knowledge-graph", "rag", "ontology", "llm", "ai-act"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/adminleo/grounded-ai-evals"

[tool.setuptools]
packages = ["gaeval"]
